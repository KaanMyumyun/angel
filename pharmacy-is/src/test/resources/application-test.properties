# Интеграционните тестове работят на H2 в режим MySQL, за да могат да се
# изпълняват на всяка машина без инсталиран MySQL сървър.
# Използва се СЪЩИЯТ файл database/01_schema.sql, както в реалната работа.

spring.datasource.url=jdbc:h2:mem:pharmacy_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

pharmacy.auto-init-database=true
# Демонстрационните данни са писани за MySQL - тестовете си слагат свои.
pharmacy.auto-seed-demo-data=false
pharmacy.expiry-warning-days=90

spring.thymeleaf.cache=false
logging.level.bg.pharmacy=WARN
logging.level.org.springframework=WARN
