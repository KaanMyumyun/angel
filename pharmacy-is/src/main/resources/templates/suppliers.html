<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Доставчици')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('suppliers')}"></nav>

<main class="container">
    <h1>Доставчици</h1>
    <p class="page-sub">Списък с фирмите, от които аптеката получава доставки.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="actions" style="margin-bottom:16px" sec:authorize="hasRole('MANAGER')">
        <a class="btn" th:href="@{/suppliers/new}">+ Нов доставчик</a>
    </div>

    <div class="card">
        <div class="empty" th:if="${#lists.isEmpty(suppliers)}">Няма въведени доставчици.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(suppliers)}">
            <table>
                <thead>
                <tr>
                    <th>Име</th><th>ЕИК</th><th>Лице за контакт</th>
                    <th>Телефон</th><th>Имейл</th><th>Състояние</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${suppliers}">
                    <td>
                        <strong th:text="${s.name}">Име</strong>
                        <div class="hint" th:if="${s.address}" th:text="${s.address}">адрес</div>
                    </td>
                    <td th:text="${s.eik} ?: '—'">—</td>
                    <td th:text="${s.contactPerson} ?: '—'">—</td>
                    <td th:text="${s.phone} ?: '—'">—</td>
                    <td th:text="${s.email} ?: '—'">—</td>
                    <td>
                        <span class="pill" th:classappend="${s.active} ? 'pill-green' : 'pill-grey'"
                              th:text="${s.active} ? 'активен' : 'неактивен'">активен</span>
                    </td>
                    <td sec:authorize="hasRole('MANAGER')">
                        <a class="btn secondary small"
                           th:href="@{/suppliers/{id}/edit(id=${s.id})}">Редактирай</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
