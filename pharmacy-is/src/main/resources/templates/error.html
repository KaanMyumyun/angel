<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Грешка')}"></head>
<body>
<main class="container" style="max-width:640px">
    <div class="card" style="margin-top:60px;text-align:center">
        <h1>Възникна грешка</h1>
        <p class="alert alert-error" style="text-align:left"
           th:text="${message} != null ? ${message} : 'Страницата не е достъпна.'">
            Съобщение
        </p>
        <div class="actions" style="justify-content:center">
            <a class="btn" th:href="@{/}">Към началната страница</a>
            <a class="btn secondary" th:href="@{/sales}">Към касата</a>
        </div>
    </div>
</main>
</body>
</html>
