<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова доставка')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('deliveries')}"></nav>

<main class="container">
    <h1>Приемане на доставка</h1>
    <p class="page-sub">
        Всеки ред става отделна партида със собствен срок на годност.
        Наличностите се увеличават веднага след запис.
    </p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/deliveries/save}" th:object="${delivery}" method="post">
        <!-- #fields работи само вътре във форма с th:object -->
        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
            <span th:each="e : ${#fields.globalErrors()}" th:text="${e}"></span>
        </div>

        <div class="card">
            <h2>Данни за доставката</h2>
            <div class="grid cols-3">
                <div class="field" th:classappend="${#fields.hasErrors('supplierId')} ? 'field-error'">
                    <label for="supplierId">Доставчик *</label>
                    <select id="supplierId" th:field="*{supplierId}">
                        <option value="">— изберете —</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}">доставчик</option>
                    </select>
                    <div class="error-text" th:if="${#fields.hasErrors('supplierId')}"
                         th:errors="*{supplierId}"></div>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('deliveryDate')} ? 'field-error'">
                    <label for="deliveryDate">Дата на доставка *</label>
                    <input type="date" id="deliveryDate" th:field="*{deliveryDate}">
                    <div class="error-text" th:if="${#fields.hasErrors('deliveryDate')}"
                         th:errors="*{deliveryDate}"></div>
                </div>

                <div class="field">
                    <label for="documentNo">Номер на документ</label>
                    <input type="text" id="documentNo" th:field="*{documentNo}" placeholder="напр. ФК-0012345">
                </div>
            </div>

            <div class="field">
                <label for="note">Забележка</label>
                <input type="text" id="note" th:field="*{note}">
            </div>
        </div>

        <div class="card">
            <h2>Доставени артикули</h2>
            <div class="error-text" th:if="${#fields.hasErrors('lines')}" th:errors="*{lines}"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th style="min-width:230px">Лекарство *</th>
                        <th>Партида №</th>
                        <th>Срок на годност *</th>
                        <th class="num">Количество *</th>
                        <th class="num">Доставна цена *</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line, i : *{lines}">
                        <td>
                            <select th:field="*{lines[__${i.index}__].medicineId}">
                                <option value="">— изберете —</option>
                                <option th:each="m : ${medicines}" th:value="${m.id}"
                                        th:text="${m.displayName}">лекарство</option>
                            </select>
                            <div class="error-text"
                                 th:if="${#fields.hasErrors('lines[__${i.index}__].medicineId')}"
                                 th:errors="*{lines[__${i.index}__].medicineId}"></div>
                        </td>
                        <td>
                            <input type="text" th:field="*{lines[__${i.index}__].batchNo}"
                                   placeholder="напр. AN-2401">
                        </td>
                        <td>
                            <input type="date" th:field="*{lines[__${i.index}__].expiryDate}">
                            <div class="error-text"
                                 th:if="${#fields.hasErrors('lines[__${i.index}__].expiryDate')}"
                                 th:errors="*{lines[__${i.index}__].expiryDate}"></div>
                        </td>
                        <td class="num">
                            <input type="number" min="1" class="qty-input"
                                   th:field="*{lines[__${i.index}__].quantity}">
                            <div class="error-text"
                                 th:if="${#fields.hasErrors('lines[__${i.index}__].quantity')}"
                                 th:errors="*{lines[__${i.index}__].quantity}"></div>
                        </td>
                        <td class="num">
                            <input type="number" step="0.01" min="0" class="qty-input"
                                   th:field="*{lines[__${i.index}__].unitCost}">
                            <div class="error-text"
                                 th:if="${#fields.hasErrors('lines[__${i.index}__].unitCost')}"
                                 th:errors="*{lines[__${i.index}__].unitCost}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="actions" style="margin-top:14px">
                <!-- formaction праща същата форма към друг адрес, който добавя празен ред -->
                <button type="submit" class="btn secondary"
                        th:formaction="@{/deliveries/add-line}">+ Още един артикул</button>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Заприходи доставката</button>
            <a class="btn secondary" th:href="@{/deliveries}">Отказ</a>
        </div>
    </form>
</main>
</body>
</html>
