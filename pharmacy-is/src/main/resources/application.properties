# =====================================================================
#  Аптека - Информационна система
#  ЕДИНСТВЕНИЯТ файл, който трябва да се пипне при пренасяне на друг компютър.
# =====================================================================

spring.application.name=pharmacy-is
server.port=8080

# --- Връзка към MySQL -------------------------------------------------
# Сменете потребител/парола според вашата инсталация на MySQL.
# createDatabaseIfNotExist=true -> ако базата "pharmacy" липсва, създава се.
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Sofia&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=pharmacy_app
spring.datasource.password=pharmacy_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# --- Поведение на приложението ---------------------------------------
# При първо стартиране таблиците се създават автоматично от database/01_schema.sql
pharmacy.auto-init-database=true
# Зареждане на примерни данни (сложете false за "чиста" аптека)
pharmacy.auto-seed-demo-data=true
# Колко дни преди изтичане на срока да се предупреждава
pharmacy.expiry-warning-days=90

# --- Уеб слой ---------------------------------------------------------
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
spring.messages.basename=messages
spring.web.resources.cache.period=3600

# Показва разбираемо съобщение вместо стандартната страница за грешка
server.error.whitelabel.enabled=false
server.error.include-message=always

# --- Логове -----------------------------------------------------------
logging.level.bg.pharmacy=INFO
logging.level.org.springframework.jdbc.core=INFO
